<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>鍵の貸し借り</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme:light dark; --bg:#f0f2f5; --fg:#24272b; --muted:#626b75; --card:#fff; --green:#06c755; --error:#b42318; }
    @media (prefers-color-scheme:dark) { :root { --bg:#121416; --fg:#f2f4f7; --muted:#aab2bd; --card:#1d2227; --green:#20c966; --error:#ff8a80; } }
    * { box-sizing:border-box; }
    body { margin:0; padding:36px 16px calc(24px + env(safe-area-inset-bottom)); background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; }
    main { max-width:640px; margin:auto; }
    .card { padding:24px; border-radius:14px; background:var(--card); box-shadow:0 2px 12px #0002; }
    #loader { width:44px; height:44px; margin:0 auto 16px; border:4px solid var(--muted); border-top-color:var(--green); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    h1 { margin:0 0 8px; font-size:20px; }
    #sub-msg { margin:0; color:var(--muted); overflow-wrap:anywhere; }
    #log-panel { margin-top:20px; padding:14px 16px; border:1px solid #8888; border-radius:10px; text-align:left; }
    #log-panel h2 { margin:0 0 8px; font-size:16px; }
    #log-list { margin:0; padding-left:22px; font-size:13px; }
    #log-list li { margin:6px 0; overflow-wrap:anywhere; }
    button { min-height:44px; margin-top:18px; padding:10px 18px; border:0; border-radius:8px; background:var(--green); color:#fff; font-size:16px; font-weight:650; }
    button:focus-visible { outline:3px solid #1677ff; outline-offset:2px; }
    .error { color:var(--error); }
    .hint { margin:14px 0 0; color:var(--muted); font-size:12px; }
    [hidden] { display:none !important; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="msg">
    <div id="loader" role="status" aria-label="処理中"></div>
    <h1 id="msg" aria-live="assertive">読み込み中...</h1>
    <p id="sub-msg" aria-live="polite">そのままお待ちください</p>
    <section id="log-panel" aria-label="処理ログ" aria-live="polite">
      <h2>LOG</h2>
      <ol id="log-list"><li>ページを開始しました</li></ol>
    </section>
    <button id="close-button" type="button" hidden>画面を閉じる</button>
    <p class="hint">LINEの共有画面で送信先を選び、メッセージを確認してください。</p>
  </section>
</main>
<script>
(() => {
  'use strict';

  // 元ファイルの値を維持しています。
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbypl-6wiNPUOk3dPjCwUKoubeLl0862obaAlBjfbR3RdbEWmS9FubfhKk3isj6XK2z9/exec';
  const LIFF_ID = '2008690527-hcW4PPyp';
  const REQUEST_TIMEOUT_MS = 3000;
  const ACTIONS = Object.freeze({
    borrow: Object.freeze({ message: '借りました', log: '借りる' }),
    return: Object.freeze({ message: '返しました', log: '返す' })
  });
  const $ = (id) => document.getElementById(id);
  let busy = false;

  function addLog(message) {
    const item = document.createElement('li');
    item.textContent = `${new Date().toLocaleTimeString('ja-JP')} ${message}`;
    $('log-list').appendChild(item);
  }

  function finish(title, detail, isError = false) {
    $('loader').hidden = true;
    $('msg').textContent = title;
    $('msg').classList.toggle('error', isError);
    $('sub-msg').textContent = detail;
    $('close-button').hidden = false;
    if (isError) addLog(`${title}: ${detail}`);
  }

  function closePage() {
    try {
      if (window.liff && liff.isInClient()) { liff.closeWindow(); return; }
    } catch (_) { /* LIFF初期化前なら通常の戻る操作を案内 */ }
    finish('画面を閉じてください', 'LINEまたはブラウザーの戻る操作で閉じてください');
  }

  function sendLog(profile, action) {
    // 元GASが受け取るJSON項目名を維持。sendBeaconは画面遷移中も送信を継続します。
    // 成功は「送信キュー受付」であり、GASやシートへの保存完了を意味しません。
    const payload = JSON.stringify({ userName: profile.displayName, userId: profile.userId, action });
    const body = new Blob([payload], { type: 'text/plain;charset=UTF-8' });
    if (navigator.sendBeacon && navigator.sendBeacon(GAS_URL, body)) {
      return Promise.resolve('queued');
    }

    // sendBeaconが使えない場合も、keepalive付きでバックグラウンド送信します。
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
    return fetch(GAS_URL, {
      method: 'POST', mode: 'no-cors', cache: 'no-store', keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: payload, signal: controller.signal
    }).then(() => 'sent').finally(() => clearTimeout(timeout));
  }

  async function main() {
    $('close-button').addEventListener('click', closePage);
    try {
      if (!window.liff) throw new Error('LIFF SDKを読み込めません。通信環境を確認してください');
      addLog('LIFFを初期化しています');
      await liff.init({ liffId: LIFF_ID });

      // LIFFがURLパラメータを復元するため、modeはinit完了後に読み取ります。
      const mode = new URLSearchParams(window.location.search).get('mode');
      if (!Object.prototype.hasOwnProperty.call(ACTIONS, mode)) {
        finish('起動URLを確認してください', 'modeにはborrowまたはreturnを指定してください', true);
        return;
      }
      const action = ACTIONS[mode];
      addLog(`処理: 鍵を${action.log}`);

      if (!liff.isLoggedIn()) {
        addLog('LINEログインへ移動します');
        liff.login({ redirectUri: window.location.href });
        return;
      }
      if (!liff.isApiAvailable('shareTargetPicker')) {
        finish('送信機能を利用できません', 'LINE Developers ConsoleでShare Target Pickerが有効か、LINEアプリから開いているか確認してください', true);
        return;
      }

      const profile = await liff.getProfile();
      if (!profile || !profile.userId || !profile.displayName) throw new Error('LINEプロフィールを取得できません。LIFFのprofile scopeと同意を確認してください');

      // 日時表示は端末設定に依存させず日本時間に固定します。
      const timeText = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).format(new Date());
      const message = `${timeText}に${profile.displayName}が鍵を${action.message}`;

      $('msg').textContent = '送信先を選択';
      $('sub-msg').textContent = '送信先と内容を確認してください';
      addLog('送信先を選択');
      if (busy) return;
      busy = true;
      const result = await liff.shareTargetPicker([{ type: 'text', text: message }]);

      if (!result) {
        addLog('送信先選択がキャンセルされました');
        finish('送信はキャンセルされました', 'LINEメッセージは送信されていません');
        return;
      }

      addLog('LINE送信完了');
      // ログ通信の完了を待たずに完了画面を出し、操作待ちをなくします。
      finish('送信完了', 'LINE通知を送信しました。LOGを確認してください');
      addLog('LOG送信を開始');
      try {
        const logState = await sendLog(profile, action.log);
        addLog(logState === 'queued' ? 'LOG送信受付済み（保存結果は未確認）' : 'LOG通信完了（保存結果は未確認）');
      } catch (err) {
        const why = err && err.name === 'AbortError' ? 'LOG通信がタイムアウトしました' : `LOG通信エラー: ${err.message || String(err)}`;
        addLog(why);
        $('sub-msg').textContent = `通知送信済み。${why}`;
        $('sub-msg').classList.add('error');
      }
    } catch (err) {
      console.error('LIFF処理エラー', err);
      const detail = err && err.message ? err.message : String(err);
      finish('処理を完了できませんでした', detail, true);
    } finally {
      busy = false;
    }
  }

  main();
})();
</script>
</body>
</html>
